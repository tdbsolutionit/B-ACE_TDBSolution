name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kill PM2 to release file locks
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          # Dùng kill thay vì stop để ép PM2 giải phóng hoàn toàn file .dll
          pm2 kill
          Start-Sleep -Seconds 2
        continue-on-error: true

      - name: Clean Workspace and Pull Latest Code
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          git reset --hard HEAD
          git clean -fd
          git fetch --all --tags
          git checkout main
          git pull origin main

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm ci

      - name: Run DB migrations and Prisma Generate
        shell: powershell
        working-directory: C:\apps\bace-crm\apps\api
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          # Thêm --accept-data-loss để tự động đồng ý, không bị treo ở màn hình chờ
          npx prisma db push --accept-data-loss
          npx prisma generate

      - name: Build shared
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/shared

      - name: Build API
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/api

      - name: Build Web
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/web

      - name: Start PM2
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          pm2 start ecosystem.config.js
          pm2 save
          Start-Sleep -Seconds 5

      - name: Health check with retry
        shell: powershell
        run: |
          $maxRetries = 6
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              $retryCount++
              Write-Host "Checking connection (Attempt $retryCount/$maxRetries)..."
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                  Write-Host "Health check OK"
                  $success = $true
              }
            } catch {
              Write-Host "Not ready, waiting 5s..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Error "Health check failed after $maxRetries attempts."
            exit 1
          }
