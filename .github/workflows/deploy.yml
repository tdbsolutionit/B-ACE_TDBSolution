name: Deploy to Production
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop PM2 Apps to release file locks
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          pm2 delete all
          Start-Sleep -Seconds 2
        continue-on-error: true

      - name: Clean Workspace and Checkout Release Tag
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          git reset --hard HEAD
          git clean -fd
          git fetch --all --tags

          git checkout tags/${{ github.ref_name }} -f
          
          if (-not (Test-Path "C:\apps\bace\ecosystem.config.js")) {
            Write-Error "LỖI: File ecosystem.config.js bị thiếu! Hãy commit file này lên Git."
            exit 1
          }

      - name: Create .env files (Without BOM)
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $linesApi = @(
            "DATABASE_URL=${{ secrets.DATABASE_URL }}",
            "JWT_SECRET=${{ secrets.JWT_SECRET }}",
            "JWT_EXPIRES=8h",
            "API_PORT=3001",
            "WEB_ORIGIN=http://192.168.103.8:3000",
            "NODE_ENV=production"
          )
          [System.IO.File]::WriteAllLines("C:\apps\bace\apps\api\.env", $linesApi, (New-Object System.Text.UTF8Encoding $False))

          $linesWeb = @(
            "NEXT_PUBLIC_API_URL=http://192.168.103.8:3001"
          )
          [System.IO.File]::WriteAllLines("C:\apps\bace\apps\web\.env.production", $linesWeb, (New-Object System.Text.UTF8Encoding $False))

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          # Sử dụng npm ci để đảm bảo cài đúng version trong package-lock.json
          npm ci

      - name: Run DB migrations and Prisma Generate
        shell: powershell
        working-directory: C:\apps\bace\apps\api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          
          # KHUYẾN NGHỊ: Nếu có dùng Prisma Migrate, hãy dùng lệnh dưới đây thay vì db push
          # npx prisma migrate deploy
          
          # Nếu bạn vẫn muốn dùng db push, hãy bỏ cờ --accept-data-loss để CI/CD chặn lại nếu có rủi ro
          npx prisma db push
          npx prisma generate

      - name: Build shared
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/shared

      - name: Build API
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/api

      - name: Build Web
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/web

      - name: Start PM2 and Verify Status
        shell: powershell
        working-directory: C:\apps\bace
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          
          pm2 start ecosystem.config.js
          pm2 save
          
          Start-Sleep -Seconds 5
          
          $statusRaw = pm2 jlist
          $onlineCount = ([regex]::Matches($statusRaw, '"status":"online"')).Count
          $errorCount = ([regex]::Matches($statusRaw, '"status":"errored"')).Count
          
          if ($errorCount -gt 0) {
            Write-Error "LỖI: Có ứng dụng bị crash (errored)! Đang in log..."
            pm2 logs --lines 50 --nostream
            exit 1
          }
          
          if ($onlineCount -lt 2) {
            Write-Error "LỖI: Chỉ có $onlineCount ứng dụng chạy (cần ít nhất 2). Đang in log..."
            pm2 logs --lines 50 --nostream
            exit 1
          }
          
          Write-Host "PM2 đang chạy $onlineCount ứng dụng."

      - name: Health check with retry
        shell: powershell
        run: |
          $maxRetries = 6
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              $retryCount++
              Write-Host "Checking connection (Attempt $retryCount/$maxRetries)..."
              # Check cả Frontend và Backend để chắc chắn 2 app đều sống
              $webResponse = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              $apiResponse = Invoke-WebRequest -Uri "http://localhost:3001" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              
              if ($webResponse.StatusCode -eq 200 -and $apiResponse.StatusCode -eq 200) {
                  Write-Host "Health check OK (Web + API)"
                  $success = $true
              }
            } catch {
              Write-Host "Not ready, waiting 5s..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Error "Health check failed after $maxRetries attempts."
            exit 1
          }
