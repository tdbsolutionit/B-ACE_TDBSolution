name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kill PM2 to release file locks
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          pm2 kill
          Start-Sleep -Seconds 2
        continue-on-error: true

      - name: Clean Workspace and Pull Latest Code
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          git reset --hard HEAD
          git clean -fd
          git fetch --all --tags
          git checkout main
          git pull origin main
          
          # BẢO VỆ FILE CONFIG VÀ ENV: Đảm bảo file ecosystem tồn tại
          if (-not (Test-Path "C:\apps\bace-crm\ecosystem.config.js")) {
            Write-Error "LỖI: File ecosystem.config.js bị thiếu! Hãy commit file này lên Git."
            exit 1
          }

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm ci

      - name: Run DB migrations, Prisma Generate and Seed
        shell: powershell
        working-directory: C:\apps\bace-crm\apps\api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          
          npx prisma db push --accept-data-loss
          npx prisma generate
          
          $currentEnv = $env:NODE_ENV
          $env:NODE_ENV = "development"
          npx prisma db seed
          $env:NODE_ENV = $currentEnv

      - name: Build shared
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/shared

      - name: Build API
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/api

      - name: Build Web
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/web

      - name: Start PM2 and Verify Status
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          
          # 1. Khởi động lại
          pm2 start ecosystem.config.js
          pm2 save
          Start-Sleep -Seconds 5
          
          # 2. KIỂM TRA XEM CÓ CHẠY THẬT KHÔNG (Bắt lỗi ngầm)
          $status = pm2 jlist | ConvertFrom-Json
          $onlineApps = $status | Where-Object { $_.pm2_env.status -eq "online" }
          
          if ($onlineApps.Count -eq 0) {
            Write-Error "LỖI: Không có ứng dụng nào chạy! Đang in log lỗi..."
            pm2 logs --lines 50 --nostream
            exit 1
          }
          Write-Host "PM2 đang chạy $($onlineApps.Count) ứng dụng."

      - name: Health check with retry
        shell: powershell
        run: |
          $maxRetries = 6
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              $retryCount++
              Write-Host "Checking connection (Attempt $retryCount/$maxRetries)..."
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                  Write-Host "Health check OK"
                  $success = $true
              }
            } catch {
              Write-Host "Not ready, waiting 5s..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Error "Health check failed after $maxRetries attempts."
            exit 1
          }
