name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop PM2
        shell: powershell
        run: |
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" stop all
          Start-Sleep -Seconds 2
        continue-on-error: true

      - name: Clean Workspace and Pull Latest Code
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          git reset --hard HEAD
          git clean -fd  # <-- ĐÃ BỎ CỜ -x ĐỂ BẢO VỆ FILE .env
          git fetch --all --tags
          git checkout main
          git pull origin main

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm ci

      - name: Run DB migrations
        shell: powershell
        working-directory: C:\apps\bace-crm\apps\api
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npx prisma db push
          npx prisma generate

      - name: Build shared
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/shared

      - name: Build API
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/api

      - name: Build Web
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          npm run build -w @bace/web

      - name: Restart PM2
        shell: powershell
        working-directory: C:\apps\bace-crm
        run: |
          $env:Path = "C:\Program Files\nodejs\;C:\Users\Administrator\AppData\Roaming\npm;" + $env:Path
          # Dùng start ecosystem thay vì restart để đảm bảo app được khởi động lại từ đầu
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" delete all
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" start ecosystem.config.js
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" save
          Start-Sleep -Seconds 5

      - name: Health check
        shell: powershell
        run: |
          # VÒNG LẶP RETRY: Thử lại 6 lần, mỗi lần cách nhau 5 giây (tổng 30s)
          $maxRetries = 6
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              $retryCount++
              Write-Host "Đang kiểm tra kết nối (Lần thử $retryCount/$maxRetries)..."
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                  Write-Host "Health check OK"
                  $success = $true
              }
            } catch {
              Write-Host "Chưa kết nối được, đợi 5 giây để thử lại..."
              Start-Sleep -Seconds 5
            }
          }
          
          if (-not $success) {
            Write-Error "Health check thất bại sau $maxRetries lần thử. Vui lòng kiểm tra lại app."
            exit 1
          }
