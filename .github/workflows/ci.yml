name: CI

on:
  push:
    branches: [main, huy-dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @bace/api
      - run: npm run build -w @bace/shared
      - run: npm test
      - run: npm run lint -w @bace/api
      - run: npm run build -w @bace/api
      - run: npm run build -w @bace/web
